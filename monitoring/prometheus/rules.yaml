groups:
  - name: oenexa-platform-alerts
    rules:
      - alert: ServiceDown
        expr: up{service=\"oenexa-platform\"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: \"oenexa-platform instance is down\"
          description: \"Pod for oenexa-platform has been down for more than 1 minute.\"
      - alert: High5xxRate
        expr: rate(http_requests_total{service=\"oenexa-platform\",status=~\"5..\"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: \"Elevated 5xx error rate on oenexa-platform\"